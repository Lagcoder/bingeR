<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bingeR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-surface: #14141f;
      --bg-card: #1d1d2c;
      --accent-red: #e50914;
      --accent-purple: #7b2cbf;
      --accent-cyan: #00f5d4;
      --text-main: #f8f9fa;
      --text-muted: #a0a0b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --glass: rgba(20, 20, 31, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 50px;
    }

    /* Header & Brand */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--glass);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0;
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -1.2px;
      color: var(--text-main);
      text-decoration: none;
    }

    .brand span {
      color: var(--accent-red);
      margin-left: 0px;
    }

    .search-container {
      position: relative;
      flex: 1;
      max-width: 500px;
    }

    .search-input {
      width: 100%;
      padding: 12px 20px 12px 45px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .search-input:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 15px rgba(123, 44, 191, 0.3);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      fill: var(--text-muted);
      width: 18px;
      height: 18px;
    }

    /* Column Grid Layout */
    .dashboard {
      padding: 24px 32px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      align-items: start;
    }

    .column-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: rgba(20, 20, 31, 0.3);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 18px;
      background: linear-gradient(180deg, var(--accent-red), var(--accent-purple));
      border-radius: 2px;
    }

    .movie-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Movie Cards: Standard Vertical Movie Aspect Ratio (2:3) */
    .movie-card {
      width: 100%;
      aspect-ratio: 2 / 3;
      height: auto;
      background-color: var(--bg-card);
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .movie-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.6);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .movie-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Top Left Badge: For You Rating */
    .badge-rating {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--accent-cyan);
      font-weight: 800;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 6px;
      z-index: 2;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px;
      background: linear-gradient(180deg, transparent 0%, rgba(10, 10, 15, 0.95) 100%);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .movie-title {
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .base-rating-text {
      color: #ffbe0b;
      font-weight: 600;
    }

    /* Modal Styling */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--bg-surface);
      width: 100%;
      max-width: 800px;
      max-height: 90vh;
      border-radius: 16px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
    }

    /* Standard Widescreen Movie Backdrop Hero */
    .modal-hero {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 320px;
      background-size: cover;
      background-position: center;
    }

    .modal-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, var(--bg-surface) 0%, transparent 100%);
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      z-index: 10;
    }

    .modal-body {
      padding: 24px 32px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal-header-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }

    .scores-container {
      display: flex;
      gap: 16px;
    }

    .score-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 10px;
      text-align: center;
    }

    .score-value {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .score-value.for-you { color: var(--accent-cyan); }
    .score-value.tmdb { color: #ffbe0b; }

    .score-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modal-description {
      line-height: 1.6;
      color: #d0d0e0;
      font-size: 0.95rem;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      background: var(--bg-card);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .detail-item h4 {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .detail-item p {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .platforms-list {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .platform-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    @media (max-width: 992px) {
      header {
        padding: 12px 16px;
        flex-direction: column;
        align-items: stretch;
      }

      .dashboard {
        padding: 16px;
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .modal-body {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="brand">binge<span>R</span></a>
    <div class="search-container">
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search movies, actors, directors, keywords...">
    </div>
  </header>

  <main class="dashboard">
    <section class="column-section">
      <h2 class="section-title">Recommended</h2>
      <div class="movie-column" id="row-recommended"></div>
    </section>

    <section class="column-section">
      <h2 class="section-title">For You</h2>
      <div class="movie-column" id="row-foryou"></div>
    </section>

    <section class="column-section">
      <h2 class="section-title">Top Rated</h2>
      <div class="movie-column" id="row-toprated"></div>
    </section>

    <section class="column-section">
      <h2 class="section-title">Remix</h2>
      <div class="movie-column" id="row-remix"></div>
    </section>
  </main>

  <!-- Detail Modal -->
  <div class="modal-backdrop" id="movieModal">
    <div class="modal-content">
      <button class="close-btn" id="closeModal">&times;</button>
      <div class="modal-hero" id="modalHero">
        <div class="modal-hero-overlay"></div>
      </div>
      <div class="modal-body">
        <div class="modal-header-info">
          <div>
            <h1 id="modalTitle" style="font-size: 1.8rem; margin-bottom: 4px;"></h1>
            <p id="modalSubhead" style="color: var(--text-muted); font-size: 0.9rem;"></p>
          </div>
          <div class="scores-container">
            <div class="score-box">
              <div class="score-value for-you" id="modalForYouScore">★ 0.0/7</div>
              <div class="score-label">For You</div>
            </div>
            <div class="score-box">
              <div class="score-value tmdb" id="modalBaseScore">★ 0.0/7</div>
              <div class="score-label">Base Rating</div>
            </div>
          </div>
        </div>

        <p class="modal-description" id="modalOverview"></p>

        <div class="details-grid">
          <div class="detail-item">
            <h4>Director</h4>
            <p id="modalDirector"></p>
          </div>
          <div class="detail-item">
            <h4>Top Cast</h4>
            <p id="modalCast"></p>
          </div>
          <div class="detail-item">
            <h4>Keywords</h4>
            <p id="modalKeywords"></p>
          </div>
        </div>

        <div>
          <h4 style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px;">Available On</h4>
          <div class="platforms-list" id="modalPlatforms"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="test.js"></script>
</body>
</html>
